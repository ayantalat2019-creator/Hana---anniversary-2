
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Hana ♡</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Georgia,"Times New Roman",serif;
    background:#fff7fa;
    color:#4b2635;
    overflow-x:hidden;
    min-height:100vh;
}

/* =========================
   FLOATING HEARTS
========================= */

.particle{
    position:fixed;
    bottom:-50px;
    pointer-events:none;
    z-index:1;
    opacity:0;
    animation:floatUp linear forwards;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }

    15%{
        opacity:.55;
    }

    100%{
        transform:translateY(-115vh) rotate(180deg);
        opacity:0;
    }
}

/* =========================
   MAIN PAGE
========================= */

.page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 18px;
    position:relative;
    z-index:2;
}

.card{
    width:100%;
    max-width:780px;
    background:rgba(255,255,255,.72);
    border:1px solid rgba(216,137,162,.28);
    border-radius:32px;
    padding:45px 30px;
    text-align:center;
    box-shadow:
        0 25px 80px rgba(110,50,75,.10),
        inset 0 1px 0 rgba(255,255,255,.8);
    backdrop-filter:blur(8px);
    animation:cardIn .8s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(25px) scale(.98);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.eyebrow{
    font-size:12px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#bd6683;
    margin-bottom:20px;
}

h1{
    font-size:clamp(42px,10vw,78px);
    font-weight:normal;
    line-height:1.05;
    color:#542637;
    margin-bottom:25px;
}

h1 span{
    color:#c45b7b;
}

h2{
    font-size:clamp(30px,7vw,50px);
    font-weight:normal;
    color:#542637;
    margin-bottom:25px;
}

p{
    color:#704657;
    font-size:17px;
    line-height:1.9;
    margin-bottom:20px;
}

.small{
    font-size:14px;
    color:#9a6275;
}

.italic{
    font-style:italic;
}

.divider{
    width:60px;
    height:1px;
    background:#d889a2;
    margin:28px auto;
}

/* =========================
   BUTTONS
========================= */

.buttons{
    margin-top:32px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

button{
    font-family:Georgia,"Times New Roman",serif;
    border:1px solid #d889a2;
    background:rgba(255,255,255,.85);
    color:#75364d;
    padding:15px 24px;
    border-radius:50px;
    font-size:15px;
    cursor:pointer;
    transition:.3s ease;
    box-shadow:0 8px 25px rgba(150,70,100,.08);
}

button:hover{
    transform:translateY(-4px) scale(1.02);
    box-shadow:0 12px 30px rgba(150,70,100,.14);
}

button:active{
    transform:scale(.96);
}

.primary{
    background:#75364d;
    color:white;
    border-color:#75364d;
}

/* =========================
   ANSWERS
========================= */

.answer{
    min-height:35px;
    margin-top:22px;
    color:#a24d6b;
    font-style:italic;
    line-height:1.7;
}

/* =========================
   LITTLE THINGS
========================= */

.little-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin:30px 0;
}

.little-box{
    background:rgba(255,255,255,.8);
    border:1px solid #f1ccd8;
    border-radius:22px;
    padding:23px 17px;
    transition:.3s;
}

.little-box:hover{
    transform:translateY(-5px);
}

.little-box .emoji{
    font-size:27px;
    margin-bottom:10px;
}

.little-box h3{
    font-size:17px;
    font-weight:normal;
    color:#8f4862;
    margin-bottom:8px;
}

.little-box p{
    font-size:14px;
    line-height:1.65;
    margin:0;
}

/* =========================
   SECRET NOTE
========================= */

.secret{
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:.8s ease;
}

.secret.show{
    max-height:500px;
    opacity:1;
    margin-top:25px;
}

.secret-inner{
    background:#fff5f8;
    border:1px dashed #d889a2;
    border-radius:22px;
    padding:25px;
}

/* =========================
   KISS SCREEN
========================= */

.kiss-screen{
    position:fixed;
    inset:0;
    background:rgba(255,235,243,.97);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    opacity:0;
    pointer-events:none;
}

.kiss-screen.show{
    opacity:1;
    pointer-events:auto;
}

.kiss{
    font-size:100px;
    animation:none;
}

.kiss-screen.show .kiss{
    animation:kissPop 1.5s cubic-bezier(.17,.67,.25,1.4) forwards;
}

@keyframes kissPop{

    0%{
        transform:scale(.1) rotate(-20deg);
        opacity:0;
    }

    35%{
        transform:scale(1.5) rotate(10deg);
        opacity:1;
    }

    60%{
        transform:scale(.9) rotate(-5deg);
    }

    80%{
        transform:scale(1.2);
    }

    100%{
        transform:scale(1);
    }
}

/* =========================
   HEART BURST
========================= */

.burst{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:10000;
    font-size:25px;
    animation:burst 1.4s ease-out forwards;
}

@keyframes burst{
    0%{
        transform:translate(-50%,-50%) scale(.2);
        opacity:1;
    }

    100%{
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1.5);
        opacity:0;
    }
}

/* =========================
   FINAL
========================= */

.final-heart{
    font-size:65px;
    margin-bottom:20px;
    animation:heartbeat 1.5s infinite;
}

@keyframes heartbeat{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .card{
        padding:38px 20px;
        border-radius:27px;
    }

    p{
        font-size:16px;
        line-height:1.85;
    }

    .little-grid{
        grid-template-columns:1fr;
    }

    button{
        width:100%;
        max-width:310px;
    }

}

</style>
</head>

<body>

<!-- FLOATING PARTICLES -->
<div id="particles"></div>

<!-- KISS ANIMATION -->
<div class="kiss-screen" id="kissScreen">
    <div class="kiss">💋</div>
</div>

<!-- EVERYTHING IS RENDERED HERE -->
<div id="app"></div>


<script>

/* =====================================================
   FLOATING HEARTS
===================================================== */

const symbols = ["♡","♥","✿","♡","♥"];

function createParticle(){

    const particle = document.createElement("div");

    particle.className = "particle";

    particle.innerHTML =
        symbols[Math.floor(Math.random()*symbols.length)];

    particle.style.left =
        Math.random()*100 + "vw";

    particle.style.fontSize =
        (12 + Math.random()*14) + "px";

    particle.style.animationDuration =
        (8 + Math.random()*6) + "s";

    document.body.appendChild(particle);

    setTimeout(()=>{
        particle.remove();
    },15000);
}

/* Not too many hearts */
setInterval(createParticle,1800);


/* =====================================================
   HEART BURST
===================================================== */

function heartBurst(){

    for(let i=0;i<12;i++){

        const heart=document.createElement("div");

        heart.className="burst";

        heart.innerHTML =
            Math.random()>.5 ? "♡" : "♥";

        heart.style.setProperty(
            "--x",
            (Math.random()*500-250)+"px"
        );

        heart.style.setProperty(
            "--y",
            (Math.random()*500-250)+"px"
        );

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },1500);
    }
}


/* =====================================================
   ROUTER
===================================================== */

function go(page){

    window.location.href =
        window.location.pathname + "?page=" + page;

}


/* =====================================================
   GET CURRENT PAGE
===================================================== */

const params =
    new URLSearchParams(window.location.search);

const current =
    params.get("page") || "home";


/* =====================================================
   HOME
===================================================== */

function home(){

    return `

    <main class="page">

        <div class="card">

            <div class="eyebrow">
                A little something for someone special
            </div>

            <h1>
                To Miss <span>Hana Ahmed</span>
            </h1>

            <p>
                I could have just sent you a normal anniversary
                message...
            </p>

            <p>
                But you know me.
                I had to make things unnecessarily complicated. ♡
            </p>

            <div class="divider"></div>

            <p class="italic">
                I wonder what this button does...
                hmm...
            </p>

            <p class="small">
                If it was me, I would have definitely pressed it.
            </p>

            <div class="buttons">

                <button
                    class="primary"
                    id="startButton"
                    onclick="firstClick()">
                    Press me ♡
                </button>

            </div>

            <div
                class="answer"
                id="homeAnswer">
            </div>

        </div>

    </main>

    `;

}


/* =====================================================
   HOME BUTTON
===================================================== */

let homeClicks = 0;

function firstClick(){

    homeClicks++;

    const answer =
        document.getElementById("homeAnswer");

    const button =
        document.getElementById("startButton");

    if(homeClicks === 1){

        answer.innerHTML =
            "Hmm... maybe you should press it again. 😭";

        button.innerHTML =
            "Okay... one more time ♡";

        heartBurst();

    }

    else{

        answer.innerHTML =
            "Oh. You actually did it. I respect the commitment. 😭";

        heartBurst();

        setTimeout(()=>{

            document
                .getElementById("kissScreen")
                .classList.add("show");

        },400);

        setTimeout(()=>{

            go("story");

        },1900);

    }

}


/* =====================================================
   STORY
===================================================== */

function story(){

    return `

    <main class="page">

        <div class="card">

            <div class="eyebrow">
                Okay... you found the entrance.
            </div>

            <h2>
                Now that I have your attention...
            </h2>

            <p>
                I could have written you one long paragraph
                and called it a day.
            </p>

            <p>
                But honestly...
                where is the fun in that?
            </p>

            <p>
                So you're going to have to make your way
                through this little thing I made for you.
            </p>

            <p>
                There are a few questions.
                A few traps.
                And probably a few moments where you're going
                to look at your screen and say,
                <i>"Ayan, seriously?"</i>
            </p>

            <div class="divider"></div>

            <p class="italic">
                First question...
                why do you think I made this?
            </p>

            <div class="buttons">

                <button onclick="storyAnswer('wrong1')">
                    Because you're bored?
                </button>

                <button onclick="storyAnswer('wrong2')">
                    Because you have too much free time?
                </button>

                <button onclick="storyAnswer('wrong3')">
                    Because you're secretly dramatic?
                </button>

                <button onclick="storyAnswer('right')">
                    Because you love me ♡
                </button>

            </div>

            <div
                class="answer"
                id="storyAnswer">
            </div>

        </div>

    </main>

    `;

}

let storyAttempts = 0;

function storyAnswer(type){

    storyAttempts++;

    const answer =
        document.getElementById("storyAnswer");

    if(storyAttempts < 3){

        const messages = [

            "That answer is suspiciously disrespectful. 😭",

            "Okay... I'm not even going to argue with that one.",

            "Wrong. But I'm giving you another chance because I love you.",

            "Hana. Please. You know the answer. 😭"

        ];

        answer.innerHTML =
            messages[Math.floor(Math.random()*messages.length)];

        heartBurst();

    }

    else{

        answer.innerHTML =
            "Fine. You win. You found the answer. Come on, there's more. ♡";

        heartBurst();

        setTimeout(()=>{
            go("littlethings");
        },1200);

    }

}


/* =====================================================
   LITTLE THINGS
===================================================== */

function littlethings(){

    return `

    <main class="page">

        <div class="card">

            <div class="eyebrow">
                The things I notice
            </div>

            <h2>
                It's the little things.
            </h2>

            <p>
                I don't think love is only about the huge,
                movie-like moments.
            </p>

            <p>
                Sometimes it's the smallest things that make
                someone slowly become a huge part of your life.
            </p>

            <div class="little-grid">

                <div class="little-box">

                    <div class="emoji">💬</div>

                    <h3>
                        The way we talk
                    </h3>

                    <p>
                        Even the completely random conversations,
                        the nonsense, the teasing, and the moments
                        where neither of us has anything important
                        to say.
                    </p>

                </div>


                <div class="little-box">

                    <div class="emoji">😭</div>

                    <h3>
                        Your reactions
                    </h3>

                    <p>
                        Somehow you can make the smallest thing
                        ten times funnier just by the way you react.
                    </p>

                </div>


                <div class="little-box">

                    <div class="emoji">💋</div>

                    <h3>
                        The kissi thing
                    </h3>

                    <p>
                        Yes, I'm mentioning it.
                        The amount of kissi I ask for and the amount
                        of kissi you give me is genuinely one of my
                        favorite stupid little things.
                    </p>

                </div>


                <div class="little-box">

                    <div class="emoji">🤍</div>

                    <h3>
                        Your presence
                    </h3>

                    <p>
                        Even when we're doing completely different
                        things, somehow knowing you're there makes
                        the day feel different.
                    </p>

                </div>

            </div>

            <div class="divider"></div>

            <button onclick="revealSecret()">
                There's probably something I'm forgetting...
            </button>

            <div
                class="secret"
                id="secret">

                <div class="secret-inner">

                    <p>
                        Maybe that's actually the point.
                    </p>

                    <p>
                        I couldn't possibly fit every little thing
                        I love about you into one website.
                    </p>

                    <p class="italic">
                        And yes, before you say it...
                        you're welcome for the website. 😭
                    </p>

                </div>

            </div>

            <div class="buttons">

                <button
                    class="primary"
                    onclick="go('changed')">
                    Okay, continue ♡
                </button>

            </div>

        </div>

    </main>

    `;

}


function revealSecret(){

    document
        .getElementById("secret")
        .classList.add("show");

    heartBurst();

}


/* =====================================================
   CHANGED ME
===================================================== */

function changed(){

    return `

    <main class="page">

        <div class="card">

            <div class="eyebrow">
                Something I don't say enough
            </div>

            <h2>
                You changed me.
            </h2>

            <p>
                Not in some dramatic,
                <i>"I became a completely different person"</i>
                kind of way.
            </p>

            <p>
                More like...
                you slowly made me want to become a better version
                of myself.
            </p>

            <p>
                You made me think more about the way I speak,
                the way I treat people, the way I handle things,
                and the kind of person I actually want to become.
            </p>

            <p>
                You made me realize that having someone you care
                about can make you want to improve without them
                even having to ask you to.
            </p>

            <div class="divider"></div>

            <p>
                And honestly, I like the person I'm becoming.
            </p>

            <p class="italic">
                So if you ever wonder whether you've had an impact
                on me...
            </p>

            <p>
                You have.
                More than you probably realize.
            </p>

            <div class="buttons">

                <button
                    class="primary"
                    onclick="go('deen')">
                    There's something else I want to tell you ♡
                </button>

            </div>

        </div>

    </main>

    `;

}


/* =====================================================
   DEEN
===================================================== */

function deen(){

    return `

    <main class="page">

        <div class="card">

            <div class="eyebrow">
                Something deeper
            </div>

            <h2>
                You made me look at my deen differently.
            </h2>

            <p>
                One of the things I genuinely admire about you
                is the way your deen is part of who you are.
            </p>

            <p>
                And I'm not saying that because I want to make
                this sound perfect or poetic.
            </p>

            <p>
                I'm saying it because seeing that side of you
                made me look at myself and think about the person
                I want to be.
            </p>

            <p>
                It made me want to become more intentional,
                more patient, more disciplined, and better in
                the way I carry myself.
            </p>

            <p>
                You never had to force that out of me.
                Sometimes just seeing something good in another
                person makes you want to build more of it in
                yourself.
            </p>

            <div class="divider"></div>

            <p class="italic">
                And that is something about you that I will
                always respect.
            </p>

            <div class="buttons">

                <button
                    class="primary"
                    onclick="go('anniversary')">
                    One last part ♡
                </button>

            </div>

        </div>

    </main>

    `;

}


/* =====================================================
   ANNIVERSARY
===================================================== */

function anniversary(){

    return `

    <main class="page">

        <div class="card">

            <div class="eyebrow">
                Our little anniversary corner
            </div>

            <h2>
                If I had to choose again...
            </h2>

            <p>
                I think I'd still choose you.
            </p>

            <p>
                Not because everything is always perfect.
                Not because we never annoy each other.
                And definitely not because you never make me
                question why I love such a dramatic person. 😭
            </p>

            <p>
                I'd choose you because somewhere along the way,
                talking to you stopped feeling like just talking
                to someone.
            </p>

            <p>
                You became part of my everyday life.
                Someone I look for.
                Someone I think about.
                Someone whose little messages can change the
                entire mood of my day.
            </p>

            <div class="divider"></div>

            <p>
                And that's what I want to remember about us.
            </p>

            <p class="italic">
                Not just one anniversary.
                Not just one date.
                But all the ordinary days that somehow became
                special because you were in them.
            </p>

            <div class="buttons">

                <button onclick="anniversaryChoice(1)">
                    That's enough romance. 😭
                </button>

                <button onclick="anniversaryChoice(2)">
                    Continue, I'm listening.
                </button>

                <button onclick="anniversaryChoice(3)">
                    Give me the actual ending.
                </button>

            </div>

            <div
                class="answer"
                id="anniversaryAnswer">
            </div>

        </div>

    </main>

    `;

}

let anniversaryClicks = 0;

function anniversaryChoice(){

    anniversaryClicks++;

    const answer =
        document.getElementById("anniversaryAnswer");

    if(anniversaryClicks < 2){

        answer.innerHTML =
            "Nice try. You don't get to escape the feelings yet. 😭";

        heartBurst();

    }
    else{

        answer.innerHTML =
            "Okay okay... you made it far enough. ♡";

        heartBurst();

        setTimeout(()=>{
            go("final");
        },1200);

    }

}


/* =====================================================
   FINAL PAGE
===================================================== */

function finalPage(){

    return `

    <main class="page">

        <div class="card">

            <div class="final-heart">
                ♡
            </div>

            <div class="eyebrow">
                For you, Hana
            </div>

            <h2>
                Happy Anniversary.
            </h2>

            <p>
                If you actually went through this entire thing,
                first of all...
            </p>

            <p>
                <b>thank you for putting up with me. 😭</b>
            </p>

            <div class="divider"></div>

            <p>
                I don't know exactly what every version of our
                future is going to look like.
            </p>

            <p>
                But I know that right now, I'm grateful for you.
                Grateful for the conversations.
                Grateful for the laughs.
                Grateful for the stupid moments.
                Grateful for the serious ones.
                And grateful for the person you've helped me
                become.
            </p>

            <p>
                I hope we keep collecting those little moments
                until one day we look back and realize just how
                much of our story was built from them.
            </p>

            <p class="italic">
                And yes...
                I still expect my kissi. 💋
            </p>

            <div class="divider"></div>

            <p>
                Happy Anniversary, Hana.
            </p>

            <p>
                I love you. ♡
            </p>

            <div class="buttons">

                <button
                    class="primary"
                    onclick="finalSecret()">
                    One last thing...
                </button>

            </div>

            <div
                class="secret"
                id="finalSecret">

                <div class="secret-inner">

                    <p>
                        If this whole website had only one answer,
                        it would be this:
                    </p>

                    <h2>
                        You. ♡
                    </h2>

                    <p>
                        Always worth the extra effort.
                    </p>

                </div>

            </div>

        </div>

    </main>

    `;

}


function finalSecret(){

    document
        .getElementById("finalSecret")
        .classList.add("show");

    heartBurst();

}


/* =====================================================
   RENDER PAGE
===================================================== */

function render(){

    const app =
        document.getElementById("app");

    if(current === "home"){
        app.innerHTML = home();
    }

    else if(current === "story"){
        app.innerHTML = story();
    }

    else if(current === "littlethings"){
        app.innerHTML = littlethings();
    }

    else if(current === "changed"){
        app.innerHTML = changed();
    }

    else if(current === "deen"){
        app.innerHTML = deen();
    }

    else if(current === "anniversary"){
        app.innerHTML = anniversary();
    }

    else if(current === "final"){
        app.innerHTML = finalPage();
    }

    else{
        app.innerHTML = home();
    }

}


/* START */

render();

</script>

</body>
</html>
